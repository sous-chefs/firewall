---
driver:
  name: vagrant
provisioner:
  name: chef_infra
  product_name: cinc
  product_version: latest
  policyfile: Policyfile.rb
  deprecations_as_errors: true
  multiple_converge: 2
  enforce_idempotency: true
  chef_license: accept-no-persist
verifier:
  name: inspec
  # <% if ENV['FIREWALL_TEST_RUN_LIST'] %>
  inspec_tests:
    - path: test/integration/removal
  inputs:
    removal_type: <%= ENV['FIREWALL_TEST_RUN_LIST'] %>
    removal_backend: <%= ENV['FIREWALL_TEST_BACKEND'] || 'auto' %>
    # <% end %>
platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: opensuse-leap-16
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: ubuntu-24.04
suites:
  - name: default
    includes:
      - almalinux-8
      - almalinux-9
      - almalinux-10
      - amazonlinux-2023
      - centos-stream-9
      - centos-stream-10
      - debian-12
      - debian-13
      - fedora-latest
      - opensuse-leap-16
      - oraclelinux-8
      - oraclelinux-9
      - rockylinux-8
      - rockylinux-9
      - rockylinux-10
      - ubuntu-20.04
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>
  - name: firewalld-simple
    includes:
      - almalinux-8
      - almalinux-9
      - almalinux-10
      - amazonlinux-2023
      - centos-stream-9
      - centos-stream-10
      - debian-12
      - debian-13
      - fedora-latest
      - opensuse-leap-16
      - oraclelinux-8
      - oraclelinux-9
      - rockylinux-8
      - rockylinux-9
      - rockylinux-10
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>
    attributes:
      firewall_test:
        backend: firewalld
    verifier:
      inspec_tests:
        - path: "<%= ENV['FIREWALL_TEST_RUN_LIST'] ? 'test/integration/removal' : 'test/integration/firewalld' %>"
  - name: ufw
    includes:
      - debian-12
      - debian-13
      - ubuntu-20.04
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>
    attributes:
      firewall_test:
        backend: ufw
  - name: iptables
    includes:
      - almalinux-8
      - almalinux-9
      - almalinux-10
      - amazonlinux-2023
      - centos-stream-9
      - centos-stream-10
      - debian-12
      - debian-13
      - rockylinux-8
      - rockylinux-9
      - rockylinux-10
      - ubuntu-20.04
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>
    attributes:
      firewall_test:
        backend: iptables
  - name: nftables
    includes:
      - debian-12
      - debian-13
      - oraclelinux-8
      - oraclelinux-9
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'nftables' %>
  - name: firewalld-advanced
    includes:
      - almalinux-8
      - almalinux-9
      - almalinux-10
      - amazonlinux-2023
      - centos-stream-9
      - centos-stream-10
      - debian-12
      - debian-13
      - fedora-latest
      - opensuse-leap-16
      - oraclelinux-8
      - oraclelinux-9
      - rockylinux-8
      - rockylinux-9
      - rockylinux-10
      - ubuntu-22.04
      - ubuntu-24.04
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'firewalld_dbus' %>
    verifier:
      inspec_tests:
        - path: "<%= ENV['FIREWALL_TEST_RUN_LIST'] ? 'test/integration/removal' : 'test/integration/firewalld-dbus' %>"
  - name: windows
    includes:
      - windows-latest
    provisioner:
      named_run_list: <%= ENV['FIREWALL_TEST_RUN_LIST'] || 'default' %>
