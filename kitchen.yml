---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  product_name: chef
  product_version: <%= ENV['CHEF_VERSION'] %>
  deprecations_as_errors: true
  chef_license: accept-no-persist
  enforce_idempotency: true
  multiple_converge: 2

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-22.04
  - name: ubuntu-24.04
  - name: windows-2016
    driver_config:
      box: tas50/windows_2016
  - name: windows-2019
    driver_config:
      box: tas50/windows_2019

suites:
  - name: default
    run_list:
      - recipe[test::default]
    verifier:
      inspec_tests:
        - path: test/integration/default

  - name: firewalld-simple
    excludes:
      - windows-2016
      - windows-2019
    run_list:
      - recipe[test::default]
    verifier:
      inspec_tests:
        - path: test/integration/firewalld
    attributes:
      firewall_test:
        backend: firewalld

  - name: ufw
    excludes:
      - almalinux-10     # UFW not available in EPEL 10 (yet?)
      - amazonlinux-2023 # No EPEL for AL2023
      - centos-stream-10 # UFW not available in EPEL 10 (yet?)
      - rockylinux-10    # UFW not available in EPEL 10 (yet?)
      - windows-2016
      - windows-2019
    run_list:
      - recipe[test::default]
    verifier:
      inspec_tests:
        - path: test/integration/ufw
    attributes:
      firewall_test:
        backend: ufw

  - name: iptables
    excludes:
      - oraclelinux-9         # iptables fails to install from Oracle repo
      - oraclelinux-9    # iptables fails to install from Oracle repo
      - windows-2016
      - windows-2019
    run_list:
      - recipe[test::default]
    verifier:
      inspec_tests:
        - path: test/integration/iptables
    attributes:
      firewall_test:
        backend: iptables

  - name: nftables
    includes:
      - debian-12
      - debian-13
      - oraclelinux-8
      - oraclelinux-9
    run_list:
      - recipe[test::nftables]
    verifier:
      inspec_tests:
        - path: test/integration/nftables

  - name: firewalld-advanced
    excludes:
      - windows-2016
      - windows-2019
    run_list:
      - recipe[test::firewalld]
    verifier:
      inspec_tests:
        - path: test/integration/firewalld-dbus
    provisioner:
      enforce_idempotency: true
      multiple_converge: 2

  - name: windows
    includes:
      - windows-2016
      - windows-2019
    run_list:
      - recipe[test::default]
    attributes:
      firewall_test:
        backend: windows
    verifier:
      inspec_tests:
        - path: test/integration/windows
