---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
  integration:
    needs: lint-unit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: default
            os: almalinux-8
          - suite: default
            os: almalinux-9
          - suite: default
            os: almalinux-10
          - suite: default
            os: amazonlinux-2023
          - suite: default
            os: centos-stream-9
          - suite: default
            os: centos-stream-10
          - suite: default
            os: debian-12
          - suite: default
            os: debian-13
          - suite: default
            os: fedora-latest
          - suite: default
            os: opensuse-leap-16
          - suite: default
            os: oraclelinux-8
          - suite: default
            os: oraclelinux-9
          - suite: default
            os: rockylinux-8
          - suite: default
            os: rockylinux-9
          - suite: default
            os: rockylinux-10
          - suite: default
            os: ubuntu-2004
          - suite: default
            os: ubuntu-2204
          - suite: default
            os: ubuntu-2404
          - suite: firewalld-simple
            os: debian-13
          - suite: firewalld-simple
            os: ubuntu-2404
          - suite: firewalld-advanced
            os: almalinux-8
          - suite: firewalld-advanced
            os: almalinux-9
          - suite: firewalld-advanced
            os: almalinux-10
          - suite: firewalld-advanced
            os: amazonlinux-2023
          - suite: firewalld-advanced
            os: centos-stream-9
          - suite: firewalld-advanced
            os: centos-stream-10
          - suite: firewalld-advanced
            os: debian-12
          - suite: firewalld-advanced
            os: debian-13
          - suite: firewalld-advanced
            os: fedora-latest
          - suite: firewalld-advanced
            os: opensuse-leap-16
          - suite: firewalld-advanced
            os: oraclelinux-8
          - suite: firewalld-advanced
            os: oraclelinux-9
          - suite: firewalld-advanced
            os: rockylinux-8
          - suite: firewalld-advanced
            os: rockylinux-9
          - suite: firewalld-advanced
            os: rockylinux-10
          - suite: firewalld-advanced
            os: ubuntu-2204
          - suite: firewalld-advanced
            os: ubuntu-2404
          - suite: ufw
            os: debian-12
          - suite: ufw
            os: debian-13
          - suite: ufw
            os: ubuntu-2004
          - suite: ufw
            os: ubuntu-2204
          - suite: ufw
            os: ubuntu-2404
          - suite: iptables
            os: almalinux-8
          - suite: iptables
            os: almalinux-9
          - suite: iptables
            os: almalinux-10
          - suite: iptables
            os: amazonlinux-2023
          - suite: iptables
            os: centos-stream-9
          - suite: iptables
            os: centos-stream-10
          - suite: iptables
            os: rockylinux-8
          - suite: iptables
            os: rockylinux-9
          - suite: iptables
            os: rockylinux-10
          - suite: iptables
            os: ubuntu-2404
          - suite: nftables
            os: debian-12
          - suite: nftables
            os: debian-13
          - suite: nftables
            os: oraclelinux-8
          - suite: nftables
            os: oraclelinux-9
    steps:
      - uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Install Policyfile
        run: chef install Policyfile.rb
      - name: Load Ubuntu20 ESM legacy firewall kernel modules
        if: matrix.os == 'ubuntu-2004'
        run: sudo modprobe -a ip_tables ip6_tables iptable_filter ip6table_filter iptable_nat ip6table_nat iptable_mangle ip6table_mangle
      - name: Test backend and lifecycle
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          TEST_SUITE: ${{ matrix.suite }}
          TEST_PLATFORM: ${{ matrix.os }}
        run: |
          instance="$TEST_SUITE-$TEST_PLATFORM"
          kitchen test "$instance" --destroy=never
          if [ "$TEST_SUITE" = iptables ]; then
            FIREWALL_TEST_RUN_LIST=nat_remove kitchen converge "$instance"
            FIREWALL_TEST_RUN_LIST=nat_remove kitchen verify "$instance" --test-base-path test/lifecycle
            kitchen converge "$instance"
            FIREWALL_TEST_RUN_LIST=custom_policy kitchen converge "$instance"
            FIREWALL_TEST_RUN_LIST=custom_policy kitchen verify "$instance" --test-base-path test/lifecycle
            FIREWALL_TEST_RUN_LIST=disable kitchen converge "$instance"
            FIREWALL_TEST_RUN_LIST=disable kitchen verify "$instance" --test-base-path test/lifecycle
          fi
          case "$TEST_SUITE" in
            firewalld-advanced) export FIREWALL_TEST_RUN_LIST=dbus_delete ;;
            nftables) export FIREWALL_TEST_RUN_LIST=nftables_delete ;;
            *) export FIREWALL_TEST_RUN_LIST=delete ;;
          esac
          export FIREWALL_TEST_BACKEND="$TEST_SUITE"
          kitchen converge "$instance"
          kitchen verify "$instance" --test-base-path test/lifecycle
          kitchen destroy "$instance"
  windows:
    needs: lint-unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Cinc Workstation
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-cinc.ps1'
          Invoke-WebRequest -Uri 'https://omnitruck.cinc.sh/install.ps1' -OutFile $installer
          . $installer
          install -project cinc-workstation -version latest
          "$env:SystemDrive\cinc-project\cinc-workstation\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Policyfile
        run: chef install Policyfile.rb
      - name: Test Windows Firewall
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.windows.yml
        run: chef exec kitchen test windows-windows-latest
